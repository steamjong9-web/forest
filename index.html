<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1021">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>종혁의 숲</title>
<style>
:root{
  --bg:#0b1021;
  --fg:#f4f6fc;
  --pn:#151d38;
  --ac:#ffd24a;
  --ac2:#ff9f1c;
  --k:clamp(44px,11vw,64px);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --bar-h:auto;
  box-sizing:border-box;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;padding:0;width:100%;height:100%;
  background:var(--bg);color:var(--fg);
  font:15px/1.45 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;
  padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
}
#w{
  position:relative;
  width:100%;max-width:820px;height:100%;
  max-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:6px 8px;gap:6px;
}
canvas#c{
  width:100%;aspect-ratio:640/352;
  max-height:min(52dvh,calc(100dvh - 210px - var(--safe-t) - var(--safe-b)));
  display:block;border-radius:14px;
  background:#000;touch-action:none;object-fit:contain;
  box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 2px rgba(255,210,74,.28);
  flex-shrink:1;
}

/* 선택 바 */
#bar{
  display:none;
  width:100%;
  max-width:640px;
  grid-template-columns:1fr 1fr;
  gap:8px;
  overflow:visible !important;
  z-index:20;
  flex-shrink:0;
}
#bar button:only-child{grid-column:1/-1}
#bar button{
  min-height:44px;
  font-size:15px;
  padding:10px 12px;
}

button{
  font:inherit;color:#fff;
  background:linear-gradient(180deg,#2a3a68 0%,#161f3d 100%);
  border:2px solid rgba(255,255,255,.22);
  border-radius:14px;
  padding:10px 12px;
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .1s ease,background .12s ease,border-color .12s ease,box-shadow .12s ease;
  box-shadow:0 3px 0 rgba(0,0,0,.35);
  -webkit-appearance:none;appearance:none;
}
button:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
button.focused, button:focus-visible{
  background:linear-gradient(180deg,#ffe066 0%,#f59f00 100%) !important;
  color:#1c1300 !important;
  border:2.5px solid #fff !important;
  box-shadow:0 0 0 3px rgba(255,210,74,.5),0 4px 12px rgba(245,159,0,.45) !important;
  transform:scale(1.02);
  outline:none !important;
  font-weight:800 !important;
}
button.focused small{color:#3a2800 !important;opacity:.95 !important}

/* 모바일 세로: 하단 컨트롤러 */
#ctl{
  width:100%;
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:2px 4px max(4px,var(--safe-b));
  margin-top:auto;
  flex-shrink:0;
  gap:8px;
}
#dp{
  display:grid;
  grid-template:repeat(3,var(--k))/repeat(3,var(--k));
  gap:0;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.4));
}
#dp button{
  border:0;border-radius:0;padding:0;
  background:linear-gradient(180deg,#5b6eb8,#384685);
  color:#fff;font-size:calc(var(--k)*.4);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.28);
  min-height:0;
}
#dp .u{grid-area:1/2;border-radius:14px 14px 0 0}
#dp .l{grid-area:2/1;border-radius:14px 0 0 14px}
#dp .r{grid-area:2/3;border-radius:0 14px 14px 0}
#dp .d{grid-area:3/2;border-radius:0 0 14px 14px}
#dp i{grid-area:2/2;background:#2c376b;box-shadow:inset 0 0 0 3px rgba(0,0,0,.22)}
#dp button:active{background:#ffd24a;color:#111}

.ab{display:flex;gap:12px;align-items:flex-end;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}
.ab button{
  width:calc(var(--k)*1.32);height:calc(var(--k)*1.32);
  border-radius:50%;padding:0;
  border:3px solid rgba(255,255,255,.9);
  font-size:calc(var(--k)*.5);font-weight:900;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.3);
  min-height:0;
}
#A{background:radial-gradient(circle at 35% 30%,#ff8fa3,#e63956 65%,#a61c34)}
#B{background:radial-gradient(circle at 35% 30%,#ffd166,#f4a261 65%,#c86d1f);margin-bottom:calc(var(--k)*.4)}

#top{
  position:fixed !important;
  top:max(8px,var(--safe-t)) !important;
  right:max(8px,var(--safe-r)) !important;
  left:auto !important;
  display:flex !important;
  gap:5px;
  z-index:10000 !important;
  flex-wrap:wrap;
  justify-content:flex-end;
  max-width:min(92vw,420px);
  pointer-events:auto !important;
  opacity:1 !important;
  visibility:visible !important;
}
#top button{
  background:rgba(16,24,48,.94) !important;
  color:#ffd24a !important;
  border:2px solid rgba(255,210,74,.65) !important;
  border-radius:999px !important;
  padding:8px 12px !important;
  font-size:16px !important;
  font-weight:800 !important;
  box-shadow:0 3px 10px rgba(0,0,0,.45) !important;
  min-height:42px !important;
  min-width:42px !important;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  line-height:1;
  pointer-events:auto !important;
  opacity:1 !important;
  visibility:visible !important;
  cursor:pointer;
}

/* 짧은 세로 화면 (작은 폰) */
@media(max-height:700px) and (orientation:portrait){
  canvas#c{max-height:min(46dvh,calc(100dvh - 190px))}
  :root{--k:clamp(40px,10.5vw,56px)}
  #bar button{min-height:40px;padding:8px 10px;font-size:14px}
}

/* 가로 모드: 아이폰·갤럭시 랜드스케이프 */
@media(orientation:landscape) and (max-height:500px),
       (orientation:landscape) and (pointer:coarse){
  body{padding:0;justify-content:center}
  #w{
    max-width:none;width:100%;height:100dvh;max-height:100dvh;
    padding:0;gap:0;justify-content:center;background:#000;
  }
  canvas#c{
    max-height:100dvh;width:auto;height:100dvh;
    max-width:100vw;border-radius:0;box-shadow:none;
  }
  #bar{
    position:fixed;bottom:max(8px,var(--safe-b));left:50%;transform:translateX(-50%);
    width:min(70vw,520px);
    grid-template-columns:repeat(2,1fr);
    gap:6px;
    background:rgba(10,15,32,.9);
    padding:8px;border-radius:14px;
    border:2px solid rgba(255,210,74,.5);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  #bar button{padding:7px 10px;font-size:clamp(12px,2.8vh,15px);min-height:36px}
  #ctl{position:fixed;inset:0;pointer-events:none;padding:0;margin:0;width:auto;display:block}
  #dp{
    position:absolute;
    left:max(12px,var(--safe-l));
    bottom:max(12px,var(--safe-b));
    pointer-events:auto;opacity:.9;
  }
  .ab{
    position:absolute;
    right:max(12px,var(--safe-r));
    bottom:max(12px,var(--safe-b));
    pointer-events:auto;opacity:.92;
  }
  #top{
    position:fixed !important;
    top:max(8px,var(--safe-t)) !important;
    right:max(10px,var(--safe-r)) !important;
    pointer-events:auto !important;max-width:none !important;
    display:flex !important;z-index:10000 !important;
  }
  #top button{min-height:36px !important;padding:6px 10px !important;font-size:14px !important}
  :root{--k:clamp(36px,9vh,52px)}
}

/* PC / 마우스·키보드 */
@media(hover:hover) and (pointer:fine){
  #dp,.ab{display:none !important}
  body{padding:12px}
  #w{justify-content:center;gap:12px;padding:12px 16px;max-width:900px}
  canvas#c{
    max-height:min(72vh,calc(100dvh - 120px));
    width:min(100%,960px);
    border-radius:16px;
  }
  #bar{
    max-width:640px;position:static;transform:none;
    background:none;border:0;padding:0;width:100%;
  }
  #bar button{padding:12px 14px;font-size:16px;min-height:48px}
  #ctl{display:none}
  #top{
    position:fixed !important;top:16px !important;right:20px !important;
    max-width:none !important;display:flex !important;z-index:10000 !important;
  }
  #top button{min-height:42px !important;padding:8px 12px !important;font-size:16px !important}
}

/* 넓은 PC 화면 */
@media(hover:hover) and (pointer:fine) and (min-width:1100px){
  canvas#c{max-height:min(78vh,720px);width:min(100%,1100px)}
}

/* 선택 버튼은 화면 아래에 고정해 캔버스 레이아웃을 밀지 않도록 함 */
#bar{position:fixed;left:50%;bottom:max(10px,var(--safe-b));transform:translateX(-50%);margin:0;padding:8px;max-height:35dvh;overflow-y:auto!important;background:rgba(10,15,32,.94);border:1px solid rgba(255,210,74,.45);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body:has(#bar[style*="display: grid"]) #ctl{visibility:hidden}
/* 전체화면: 게임 비율을 유지하면서 화면 안에 최대 크기로 표시 */
body:fullscreen,body:-webkit-full-screen{width:100vw;height:100vh;height:100dvh;min-height:0;margin:0;padding:0;display:block;overflow:hidden;background:#000}
body:fullscreen #w,body:-webkit-full-screen #w{position:absolute;inset:0;width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;gap:0;justify-content:center;align-items:center;background:#000;overflow:hidden}
body:fullscreen canvas#c,body:-webkit-full-screen canvas#c{width:min(100vw,calc(100dvh * 1.8181818));height:auto;max-width:100vw;max-height:100dvh;aspect-ratio:640/352;flex:0 1 auto;border-radius:0;box-shadow:none}
#top #ex{display:none!important}
body:fullscreen #top #ex,body:-webkit-full-screen #top #ex{display:inline-flex!important}
/* 모달/오버레이 공통 터치 스크롤 */
[style*="position:fixed"][style*="inset:0"]{
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}

/* ===== 모바일 보강: 입력 / 컨트롤 / 상단 메뉴 ===== */
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;touch-action:manipulation}
button,#ctl,#top,#dp,.ab,canvas#c{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#dp{touch-action:none;-webkit-tap-highlight-color:transparent}
#dp button{pointer-events:none}
@media(pointer:coarse){
  :root{--k:clamp(56px,16.5vw,86px)}
  #dp{filter:none;opacity:.6}
  #dp button{background:rgba(255,255,255,.24);color:rgba(255,255,255,.95);border:1.5px solid rgba(255,255,255,.4);box-shadow:none;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  #dp i{background:rgba(255,255,255,.1);box-shadow:none}
  #dp button.on{background:rgba(255,210,74,.6);color:#111}
  .ab{filter:none;opacity:.6;gap:10px}
  .ab button{width:calc(var(--k)*1.1);height:calc(var(--k)*1.1);border:2px solid rgba(255,255,255,.65);box-shadow:none;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  #A{background:radial-gradient(circle at 35% 30%,rgba(255,143,163,.75),rgba(230,57,86,.65) 65%,rgba(166,28,52,.6))}
  #B{background:radial-gradient(circle at 35% 30%,rgba(255,209,102,.75),rgba(244,162,97,.65) 65%,rgba(200,109,31,.6));margin-bottom:calc(var(--k)*.35)}
  .ab button:active{opacity:1;transform:scale(.94)}
}
/* 세로 화면: 상단 메뉴를 게임 화면 위쪽 줄로 분리(게이지·대사 가림 방지) */
@media(orientation:portrait) and (pointer:coarse){
  #top{position:static !important;order:-1;width:100%;max-width:none !important;justify-content:space-between !important;flex-wrap:nowrap !important;gap:6px !important;padding:0 2px;margin:0 0 2px}
  #top button{flex:1 1 0;min-width:0 !important;white-space:nowrap;min-height:38px !important;padding:5px 4px !important;font-size:17px !important;box-shadow:none !important}
  #w{padding-top:4px}
  #top #ex{flex:0 0 auto}
}
/* 가로 화면: 메뉴를 오른쪽 가장자리 세로 줄로, 반투명하게 */
@media(orientation:landscape) and (pointer:coarse){
  :root{--k:clamp(56px,17vh,84px)}
  #top{flex-direction:column !important;flex-wrap:nowrap !important;gap:5px !important;top:max(6px,var(--safe-t)) !important;right:max(6px,var(--safe-r)) !important}
  #top button{min-height:34px !important;min-width:34px !important;padding:3px 7px !important;font-size:15px !important;background:rgba(16,24,48,.55) !important;border-width:1.5px !important;box-shadow:none !important}
}
</style>

  <canvas id="c" width="1920" height="1056"></canvas>

    <button type="button" id="sv" title="저장">💾</button>
    <button type="button" id="mu" title="소리 켜기/끄기">🔊</button>
    <button type="button" id="fs" title="전체화면">⛶</button>
    <button type="button" id="ex" title="전체화면 나가기">나가기</button>

      <button type="button" id="A">A</button>
    </div>
  </div>
</div>

function dmd(m){
  const q=SP[m.s],c=q[3],t=q[2],ev=!!q[7],sc=ev?1.0:.97,hi=dk(c,1.38),lo=dk(c,.62);
  gx.save();gx.translate(34,45);gx.scale(.72*sc,.72*sc);
  if(q[8])lgd();
  if(ev){
    const ag=gx.createRadialGradient(0,-4,8,0,0,52);
    ag.addColorStop(0,c+'77');ag.addColorStop(1,'#0000');
    gx.fillStyle=ag;gx.beginPath();gx.arc(0,0,52,0,7);gx.fill();
  }
  const limb=(x,y,rx,ry,col)=>{
    const g=gx.createRadialGradient(x-rx*.3,y-ry*.3,rx*.1,x,y,rx*1.1);
    g.addColorStop(0,dk(col,1.3));g.addColorStop(.5,col);g.addColorStop(1,dk(col,.6));
    gx.fillStyle=g;gx.beginPath();gx.ellipse(x,y,rx,ry,0,0,7);gx.fill();
    gx.strokeStyle=dk(col,.45);gx.lineWidth=1.2;gx.stroke();
  };

  if(MBK[m.s])MBK[m.s](gx);
  if(t=='bottle'){
    // 진짜 투명 페트병(PET) 질감: 병목, 뚜껑, 굴곡진 몸체, 라벨, 플라스틱 광택 반사
    limb(-21,16,6.5,9.5,c);limb(21,16,6.5,9.5,c);
    limb(-10,33,7.5,5.5,lo);limb(10,33,7.5,5.5,lo);

    // 반투명 PET 몸체 실루엣
    const pg=gx.createLinearGradient(-22,0,22,0);
    pg.addColorStop(0,'rgba(2,119,189,0.78)');
    pg.addColorStop(0.25,'rgba(179,229,252,0.88)');
    pg.addColorStop(0.55,'rgba(79,195,247,0.72)');
    pg.addColorStop(0.85,'rgba(225,245,254,0.92)');
    pg.addColorStop(1,'rgba(1,87,155,0.82)');

    gx.fillStyle=pg;
    gx.beginPath();
    gx.moveTo(-8,-26);
    gx.lineTo(8,-26);
    gx.quadraticCurveTo(21,-16,21,-4);
    gx.quadraticCurveTo(18,4,21,12);
    gx.quadraticCurveTo(22,26,14,31);
    gx.lineTo(-14,31);
    gx.quadraticCurveTo(-22,26,-21,12);
    gx.quadraticCurveTo(-18,4,-21,-4);
    gx.quadraticCurveTo(-21,-16,-8,-26);
    gx.closePath();
    gx.fill();
    gx.strokeStyle='#0277bd';gx.lineWidth=1.6;gx.stroke();

    // 페트병 내부 물결
    gx.fillStyle='rgba(3,169,244,0.38)';
    gx.beginPath();
    gx.moveTo(-19,12);gx.quadraticCurveTo(0,7,19,12);
    gx.quadraticCurveTo(20,25,13,30);gx.lineTo(-13,30);gx.quadraticCurveTo(-20,25,-19,12);
    gx.fill();

    // 플라스틱 허리 리브(주름선)
    gx.strokeStyle='rgba(255,255,255,0.55)';gx.lineWidth=1.3;
    [-4,16].forEach(yy=>{gx.beginPath();gx.moveTo(-19,yy);gx.quadraticCurveTo(0,yy+3,19,yy);gx.stroke()});

    // 비닐 라벨 띠
    gx.fillStyle='#0288d1';
    gx.beginPath();gx.roundRect(-20,17,40,9,2);gx.fill();
    gx.fillStyle='#e1f5fe';gx.fillRect(-16,19,20,2.5);
    gx.fillStyle='#ffd54f';gx.fillRect(8,19,8,5);

    // 병목 링 & 파란 플라스틱 뚜껑(골지 표현)
    gx.fillStyle='#81d4fa';gx.fillRect(-10,-28,20,3);
    const cg=gx.createLinearGradient(-10,-39,10,-39);
    cg.addColorStop(0,'#01579b');cg.addColorStop(0.35,'#29b6f6');cg.addColorStop(1,'#0277bd');
    gx.fillStyle=cg;gx.beginPath();gx.roundRect(-10,-39,20,11,[3,3,1,1]);gx.fill();
    gx.strokeStyle='#01579b';gx.lineWidth=1.2;gx.stroke();
    gx.strokeStyle='rgba(255,255,255,0.45)';gx.lineWidth=1;
    for(let rx=-6;rx<=6;rx+=3){gx.beginPath();gx.moveTo(rx,-38);gx.lineTo(rx,-29);gx.stroke()}

    // 플라스틱 고광택 세로 하이라이트
    gx.fillStyle='rgba(255,255,255,0.72)';
    gx.beginPath();gx.roundRect(-14,-14,4.5,26,2.5);gx.fill();
    gx.beginPath();gx.arc(-11.5,-19,2,0,7);gx.fill();

    if(ev){
      gx.fillStyle='#1565c0';gx.beginPath();gx.roundRect(-25,-8,5,22,2);gx.fill();
      gx.beginPath();gx.roundRect(20,-8,5,22,2);gx.fill();
    }

  else if(t=='bag'){

    else if(m.type==='catch')cur=CMSTAT.catch||0;

let FI=0,FL=null,fcnt=0;
const topUI=()=>{
  const o=[...document.body.children].filter(e=>e.tagName=='DIV'&&/z-index:\s*(3|4)\d/.test(e.style.cssText)).pop();
  if(o)return o;
  const b=$('bar');
  return b.style.display=='grid'?b:null;
};
const fbtns=u=>[...u.querySelectorAll('button')].filter(b=>!b.disabled&&b.getClientRects().length>0);
function fsync(){
  const u=topUI();
  document.querySelectorAll('button.focused').forEach(b=>b.classList.remove('focused'));
  if(!u){FL=null;return}
  const bs=fbtns(u);
  if(FL!==u||bs.length!==u._n){FL=u;u._n=bs.length;FI=0}
  FI=Math.max(0,Math.min(FI,bs.length-1));
  bs.forEach((b,i)=>{
    if(i==FI){
      b.classList.add('focused');
    }
  });
}
function kp(d){
  const u=topUI();if(!u)return 0;
  const bs=fbtns(u);if(!bs.length)return 1;
  FI=(FI+(d=='l'||d=='u'?-1:1)+bs.length)%bs.length;
  fsync();snd(520,.04,'square',.04);return 1;
}
function okk(){
  const u=topUI();
  if(u){if(+u.dataset.lock>performance.now())return;const b=fbtns(u)[FI];if(b)b.click();return}
  if(mode=='d')nxt();else act();
}
new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType==1&&n.tagName=='DIV'&&/z-index:\s*(3|4)\d/.test(n.style.cssText))n.dataset.lock=performance.now()+800}))}).observe(document.body,{childList:true});
function back(){
  const u=topUI();
  if(u){const b=fbtns(u).find(b=>/뒤로|취소|닫기|나가기|포기/.test(b.textContent));if(b)b.click();return}
  if(mode=='w')menu();
}

<div id="gate" style="display:none;position:fixed;inset:0;z-index:99999;background:linear-gradient(#0b1021,#1a2550);color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px;font:16px/1.6 system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <div style="max-width:360px">
    <div style="font-size:54px">🌙</div>
    <h2 style="margin:6px 0 10px;color:#ffd36b">지금은 이용 시간이 아니에요</h2>
    <p style="margin:0 0 6px">이 게임은 <b>수업 시간(08:30 ~ 16:30)</b>에만 할 수 있어요.</p>
    <p id="gate_t" style="margin:0 0 12px;opacity:.85"></p>
    <p style="margin:0;font-size:13px;opacity:.75">저장된 진행 상황은 그대로 남아 있어요.<br>이용 시간이 되면 이 화면이 자동으로 사라집니다.</p>
  </div>
</div>
<script>
/* ===== 이용 시간 제한 (한국 시간 기준) =====
   - 저장 데이터(localStorage)는 건드리지 않고, 잠기기 직전에 자동 저장만 합니다.
   - 교사 점검용: 주소 뒤에 ?teacher=TEACHER_KEY 로 한 번 접속하면 그 기기는 제한이 풀립니다. (?teacher=off 로 다시 적용) */
(()=>{
  const OPEN=8*60+30, CLOSE=16*60+30, WEEKDAYS_ONLY=false, ENABLED=true, TEACHER_HASH='4bd240d23a83cc3e1d14e56e6ea43bc49286ba7cfb71d977ed3c31b4b9c757c2';
  let skew=0,locked=false;const g=document.getElementById('gate');
  const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(v=>v.toString(16).padStart(2,'0')).join('');
  const bypass=()=>{try{return localStorage.getItem('gate_bypass')===TEACHER_HASH}catch(e){return false}};
  try{const k=new URLSearchParams(location.search).get('teacher');if(k==='off')localStorage.removeItem('gate_bypass');else if(k)sha(k).then(h=>{if(h===TEACHER_HASH){localStorage.setItem('gate_bypass',TEACHER_HASH);check()}}).catch(()=>{})}catch(e){}
  const kst=()=>new Date(Date.now()+skew+9*3600e3);
  const allowed=()=>{if(!ENABLED||bypass())return true;const d=kst(),m=d.getUTCHours()*60+d.getUTCMinutes(),w=d.getUTCDay();if(WEEKDAYS_ONLY&&(w==0||w==6))return false;return m>=OPEN&&m<CLOSE};
  const stopKeys=e=>{if(locked){e.stopImmediatePropagation();e.preventDefault()}};
  ['keydown','keyup'].forEach(v=>addEventListener(v,stopKeys,true));
  function lock(){if(locked)return;locked=true;try{if(typeof save==='function')save()}catch(e){}g.style.display='flex';try{for(const k in dir)dir[k]=0}catch(e){}}
  function unlock(){locked=false;g.style.display='none'}
  function check(){const d=kst(),hh=String(d.getUTCHours()).padStart(2,'0'),mm=String(d.getUTCMinutes()).padStart(2,'0');const gt=document.getElementById('gate_t');if(gt)gt.textContent='현재 시각 '+hh+':'+mm;allowed()?(locked&&unlock()):lock()}
  check();
  fetch(location.href.split('#')[0],{method:'HEAD',cache:'no-store'}).then(r=>{const h=r.headers.get('date');if(h){const t=Date.parse(h);if(!isNaN(t)){skew=t-Date.now();check()}}}).catch(()=>{});
  setInterval(check,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
})();
</script>
